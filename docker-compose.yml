# Full-stack deployment for the UK-rent agent.
#
#   app     :5001  ── the agent web app (uvicorn/ASGI)
#   searxng :8080  ── private metasearch backend for the web_search tool
#   valkey         ── cache / rate-limit store for SearXNG (internal only)
#
# The app reaches SearXNG over the compose network at http://searxng:8080
# (SEARXNG_URL), so the web_search tool works without anything on the host.
#
#   docker compose up -d --build      # build + start everything
#   open http://localhost:5001        # the agent UI
#
# Secrets and pre-built data come from the host via bind mounts (see `app`),
# so nothing sensitive is baked into the image.

services:
  valkey:
    image: valkey/valkey@sha256:cfe71288f087704b06be45e270afa7a2abbf820093d6b11a23762081f5ff321d
    container_name: uk-rent-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.50
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    networks: [rentnet]
    volumes:
      - valkey_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng@sha256:a1a04679fe6a4fa6bfe9efb82adfbe7bee4eaef8d77b2392562ca5bfe032c4be
    container_name: uk-rent-searxng
    restart: unless-stopped
    user: "977:977"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    depends_on:
      valkey:
        condition: service_started
    networks: [rentnet]
    ports:
      # Published to the host too, so a host-run copy of the app (or curl) can
      # also hit the JSON API at http://localhost:8080.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
      - searxng_cache:/var/cache/searxng
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      # Public URL SearXNG advertises for itself.
      SEARXNG_BASE_URL: "http://localhost:8080/"
      FORCE_OWNERSHIP: "false"
      # Overrides server.secret_key in settings.yml. Never hardcode this: Compose
      # reads it from the root-level .env (its default env file) or the shell
      # environment at `docker compose` time. `:?` makes the stack refuse to start
      # if it is unset, so an empty/placeholder secret can never ship silently.
      # Generate one with:  openssl rand -hex 32   (see .env.example)
      SEARXNG_SECRET: "${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env (openssl rand -hex 32)}"
    healthcheck:
      # Process/readiness only. A healthcheck must not generate real searches.
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null 'http://localhost:8080/healthz' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_SOURCE_SHA: "${LEGACY_APP_SHA:-unknown}"
        PROMPT_VERSION: "${PROMPT_VERSION:-unknown}"
        PROMPT_SCHEMA_SHA: "${PROMPT_SCHEMA_SHA:-unknown}"
    image: uk-rent-agent:latest
    container_name: uk-rent-app
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 5g
    cpus: 3.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}
    # Trust the X-Forwarded-* headers set by the nginx reverse proxy so the app
    # sees the real client IP and https scheme (needed for Secure session cookies).
    # forwarded-allow-ips=* is safe because the port is bound to 127.0.0.1 (see
    # the ports: mapping) — only nginx on this host can reach the app.
    command:
      - python
      - -m
      - uvicorn
      - uk_rent_agent.web.asgi:create_asgi_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "5001"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    # No depends_on: SearXNG/Valkey are optional web-search infrastructure.
    # /ready reports their loss as degraded while core chat remains startable.
    networks: [rentnet]
    ports:
      # Bound to loopback only: reachable via the nginx reverse proxy on this
      # host, NOT exposed on the public IP. (Was "5001:5001".)
      - "127.0.0.1:5001:5001"
    # Brings in LLM keys, FLASK_SECRET_KEY, PROPERTY_SOURCE, etc.
    env_file:
      - ./app/.env
    environment:
      # Point the web_search tool at the SearXNG service on the compose network.
      SEARXNG_URL: "http://searxng:8080"
      PYTHONUNBUFFERED: "1"
      # This deployment is a demo: guests can use the app without registering.
      # Their server-issued session cookie remains the identity boundary.
      REQUIRE_AUTH: "false"
      SESSION_COOKIE_SECURE: "true"
      ALLOW_LEGACY_CLIENT_USER_ID: "false"
      MAX_REQUEST_BYTES: "262144"
      # --- Canary pins (legacy pool) ------------------------------------------
      # These only make the current effective defaults EXPLICIT + turn on
      # per-turn telemetry; they change no behaviour. They take effect the next
      # time this container is RECREATED — ops keeps the running legacy
      # container as-is; recreate it on a telemetry-capable image before
      # advancing past the `internal` stage (see docs/canary_runbook.md).
      AGENT_ARCH: "legacy"
      # --- Pool self-identification (rollback provenance) ---------------------
      # Mirrors app-fc's APP_CANDIDATE_SHA (below) — but with the OPPOSITE
      # substitution operator, deliberately:
      #
      #   app-fc :  "${FC_CANARY_SHA:?…}"   REQUIRED  — no fc pool without a pin
      #   app    :  "${LEGACY_APP_SHA:-}"   DEFAULTED — never blocks a rollback
      #
      # `app` is the ONLY rollback target. A `:?` here would make EVERY
      # `docker compose` command fail while the variable is missing — including
      # the one that brings the escape hatch back. That is exactly the
      # FC_CANARY_IMAGE/FC_CANARY_SHA failure mode, and reproducing it on the
      # rollback target would break the one path you take in an emergency. So:
      # `:-` with an EMPTY default, which fails safe.
      #
      # UNSET → APP_CANDIDATE_SHA="" in the container, which app/app.py reads as
      #   (os.getenv("APP_CANDIDATE_SHA") or "").strip() or _startup_git_sha()
      # so empty is indistinguishable from unset: it falls through to the git
      # probe, which returns "unknown" inside the image (.dockerignore excludes
      # .git). i.e. TODAY'S behaviour, byte-for-byte, and no new way to fail.
      # SET → that sha is stamped on X-Agent-Version by BOTH response paths
      # (Flask after_request in app/app.py and the Starlette-native health
      # route in src/uk_rent_agent/web/asgi.py) and recorded in per-turn
      # telemetry, so deploy/switch_pool.sh --to legacy stops needing
      # --allow-unidentified-target.
      #
      # Use the FULL 40-char sha the image was built from — deploy/update.sh's
      # pin gate guarantees that is DEPLOY_PINNED_SHA from the server-local pin
      # file. A short sha is worse than nothing: switch_pool.sh requires exactly
      # 40 chars, so a 7-char value still forces --allow-unidentified-target.
      #
      # INERT UNTIL THIS CONTAINER IS RECREATED, like the canary pins above. Do
      # NOT recreate `app` to pick it up — it is the standing escape hatch while
      # fc_loop holds the public edge. Set LEGACY_APP_SHA in the root .env as
      # part of the next PLANNED public rebuild; "the public pool can
      # self-identify" is a cutover precondition, not a hotfix.
      APP_CANDIDATE_SHA: "${LEGACY_APP_SHA:-}"
      APP_SOURCE_SHA: "${LEGACY_APP_SHA:-unknown}"
      APP_IMAGE_DIGEST: "${LEGACY_IMAGE_DIGEST:-unknown}"
      PROMPT_VERSION: "${PROMPT_VERSION:-unknown}"
      PROMPT_SCHEMA_SHA: "${PROMPT_SCHEMA_SHA:-unknown}"
      # Local builds may not yet have an OCI digest/prompt seal. Production
      # deploy/update.sh writes RELEASE_METADATA_REQUIRED=1 before recreation.
      RELEASE_METADATA_REQUIRED: "${RELEASE_METADATA_REQUIRED:-0}"
      READINESS_REQUIRE_LLM: "1"
      ROUTING_MODE: "blue_green_shared_conversation_store"
      CHECKPOINT_DB_PATH: "/app/.runtime/checkpoints.sqlite3"
      # Conversation store is SHARED between pools (same file as app-fc): the
      # user-visible transcript, turn leases, idempotency rows and durable
      # background-job outbox live here. Nginx activates one whole pool at a
      # time; this shared DB makes requests safe without sticky load-balancer
      # routing across a cutover. Checkpoints, by contrast, are
      # SEPARATE per arch (see CHECKPOINT_DB_PATH above / app-fc below): legacy
      # must NEVER read fc's LangGraph checkpoints — that state is treated as
      # untrusted/abandoned after rollback.
      CONVERSATION_DB_PATH: "/app/.runtime/conversations.sqlite3"
      CANARY_LOG_PATH: "/app/.runtime/logs/canary-legacy.jsonl"
    volumes:
      # Secrets (also read directly by config.from_env via load_dotenv).
      - ./app/.env:/app/app/.env:ro
      # Pre-built + writable RAG indexes and runtime state, shared with the host.
      - ./chroma_db:/app/chroma_db
      - ./chroma_db_area:/app/chroma_db_area
      - ./app/chroma_db_agent_memory:/app/app/chroma_db_agent_memory
      - ./app/data:/app/app/data
      - ./.runtime:/app/.runtime
      # Embedding-model cache so it is downloaded only once.
      - hf_cache:/opt/hf-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # --- Canary fc pool (internal stage) --------------------------------------
  # The second pool that runs the candidate `fc_loop` arch alongside legacy.
  # It is gated behind the "canary" profile, so the plain
  #   docker compose up -d
  # brings up ONLY the legacy stack (app/searxng/valkey) — unchanged. The fc
  # pool starts explicitly with:
  #   docker compose --profile canary up -d app-fc
  #
  # IMMUTABILITY: no `build:` here on purpose. The fc pool runs a fixed,
  # pre-built image referenced by its immutable tag, so the working tree can
  # never silently become what canary traffic executes. Build the tag out of
  # band (git worktree/archive at the candidate sha) and set FC_CANARY_IMAGE +
  # FC_CANARY_SHA in the compose .env — see docs/canary_runbook.md "Image build".
  app-fc:
    profiles: ["canary"]
    image: "${FC_CANARY_IMAGE:?FC_CANARY_IMAGE must be set to the immutable canary image, e.g. uk-rent-agent:canary-fc-loop-<sha>}"
    container_name: uk-rent-app-fc
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 5g
    cpus: 3.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}
    # Identical entrypoint to `app`: same uvicorn factory, same proxy-header
    # handling. Only the arch/strict flags and DB/telemetry paths differ (below).
    command:
      - python
      - -m
      - uvicorn
      - uk_rent_agent.web.asgi:create_asgi_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "5001"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    # Same optional-dependency contract as legacy; never hold app startup on
    # web-search infrastructure.
    networks: [rentnet]
    ports:
      # Loopback only, and deliberately NOT wired into the host nginx: during
      # the `internal` stage the fc pool takes internal-only traffic (curl /
      # manual smoke) on :5002. Public canary weighting comes later, upstream.
      - "127.0.0.1:5002:5001"
    # Same secrets/keys as legacy.
    env_file:
      - ./app/.env
    environment:
      # Everything the legacy `app` service sets...
      SEARXNG_URL: "http://searxng:8080"
      PYTHONUNBUFFERED: "1"
      REQUIRE_AUTH: "false"
      SESSION_COOKIE_SECURE: "true"
      ALLOW_LEGACY_CLIENT_USER_ID: "false"
      MAX_REQUEST_BYTES: "262144"
      # ...plus the canary knobs that make this the fc pool:
      AGENT_ARCH: "fc_loop"
      # Strict function-calling (1 = strict FC) for the fc_loop harness.
      DEEPSEEK_STRICT: "1"
      # Pinned candidate sha — surfaced in X-Agent-Version and per-turn telemetry.
      APP_CANDIDATE_SHA: "${FC_CANARY_SHA:?FC_CANARY_SHA must be set to the candidate commit sha}"
      APP_SOURCE_SHA: "${FC_CANARY_SHA:?FC_CANARY_SHA must be set to the candidate commit sha}"
      APP_IMAGE_DIGEST: "${FC_IMAGE_DIGEST:?FC_IMAGE_DIGEST must identify the immutable canary image}"
      PROMPT_VERSION: "${PROMPT_VERSION:?PROMPT_VERSION must identify the prompt contract}"
      PROMPT_SCHEMA_SHA: "${PROMPT_SCHEMA_SHA:?PROMPT_SCHEMA_SHA must be a sha256}"
      RELEASE_METADATA_REQUIRED: "1"
      READINESS_REQUIRE_LLM: "1"
      ROUTING_MODE: "blue_green_shared_conversation_store"
      # SEPARATE checkpoint DB: fc's LangGraph checkpoints live in their own
      # file so legacy never reads them (and vice-versa). This is the state
      # isolation boundary between the two arches.
      CHECKPOINT_DB_PATH: "/app/.runtime/checkpoints_fc.sqlite3"
      # SHARED conversation store: same file/mount as legacy `app`. Complete
      # transcripts, turn leases, idempotency and the durable background outbox
      # survive whole-pool cutovers; no load-balancer session affinity is
      # assumed. Checkpoints remain architecture-local.
      CONVERSATION_DB_PATH: "/app/.runtime/conversations.sqlite3"
      # Per-turn canary telemetry sink (event canary.turn), one bare-JSON line
      # per turn; consumed by scripts/canary_report.py --input .runtime/logs/.
      CANARY_LOG_PATH: "/app/.runtime/logs/canary-fc_loop.jsonl"
    volumes:
      # Same bind mounts as `app` — crucially the SHARED ./.runtime, which holds
      # the shared conversation store, both (separate) checkpoint DBs, and the
      # host-visible telemetry logs under ./.runtime/logs/.
      - ./app/.env:/app/app/.env:ro
      - ./chroma_db:/app/chroma_db
      - ./chroma_db_area:/app/chroma_db_area
      - ./app/chroma_db_agent_memory:/app/app/chroma_db_agent_memory
      - ./app/data:/app/app/data
      - ./.runtime:/app/.runtime
      - hf_cache:/opt/hf-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  rentnet:
    driver: bridge

volumes:
  valkey_data:
  searxng_cache:
  hf_cache:
