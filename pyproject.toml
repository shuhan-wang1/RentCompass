[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-rent-agent"
version = "0.1.0"
description = "UK student rental recommendation agent"
requires-python = ">=3.10,<3.13"
dependencies = [
  "flask[async]",
  "flask-cors",
  "pandas",
  "python-dotenv",
  "requests",
  "waitress",
  "sentence-transformers", "faiss-cpu", "geopy", "folium", "ddgs",
  "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite", "langchain", "langchain-core", "langchain-ollama",
  # mcp 2.0.0 (2026-07-28) drops the low-level Server decorator API that
  # app/mcp_server.py is built on: `@server.list_tools()` raises AttributeError
  # at import. Bounded like langgraph above until that migration is done
  # deliberately — an unbounded major is what turned CI red with no code change.
  "langchain-openai", "openai", "mcp<2",
  "pydantic>=2.7", "starlette", "uvicorn[standard]",
]

[project.optional-dependencies]
finetune = ["torch", "torchvision", "torchaudio", "transformers", "peft", "accelerate"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "import-linter==2.13"]

[project.scripts]
uk-rent-web = "uk_rent_agent.web.__main__:main"
uk-rent-asgi = "uk_rent_agent.web.asgi:main"
uk-rent-eval-gate = "uk_rent_agent.evals.ci_gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "app", "."]
testpaths = ["tests", "tests_refactor"]
