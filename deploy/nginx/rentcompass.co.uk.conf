# Reverse proxy for the UK-rent agent — rentcompass.co.uk
# App runs as a Docker container: uvicorn/Flask on 127.0.0.1:5001.
#
# Install path: /etc/nginx/sites-available/rentcompass.co.uk.conf
#   symlink -> /etc/nginx/sites-enabled/  then `nginx -t && systemctl reload nginx`
#
# This starts as an HTTP (port 80) vhost. `certbot --nginx` will add the TLS
# server block on 443 and an HTTP->HTTPS redirect automatically. The SSE and
# timeout directives live inside `location /` so they survive certbot's edits.

# The generated include supplies a stable cohort key, a 0/5/20/50/100 split,
# and the selected loopback port.  Its committed/install default is 0% candidate.
include /etc/nginx/snippets/rentcompass-canary-routing.conf;

server {
    listen 80;
    listen [::]:80;
    server_name rentcompass.co.uk www.rentcompass.co.uk;
    access_log /var/log/nginx/rentcompass-canary.log rentcompass_canary;

    # Let's Encrypt HTTP-01 challenge webroot (harmless before/after TLS).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Upload headroom (property images, etc.)
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:$rentcompass_backend_port;
        proxy_http_version 1.1;

        # Observable routing proof for rollout checks.  This contains only the
        # pool label (legacy|candidate), never the cohort key.
        add_header X-RentCompass-Pool $rentcompass_pool always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sole trusted edge: discard any client-provided forwarding chain.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # One ID at both trust boundaries: nginx access-log denominator and
        # application canary.turn telemetry can now be reconciled directly.
        proxy_set_header X-Request-ID      $request_id;
        # Trusted rollout provenance: overwrite any client-supplied values.
        proxy_set_header X-RentCompass-Rollout-ID     $rentcompass_rollout_id;
        proxy_set_header X-RentCompass-Rollout-Stage  $rentcompass_rollout_stage;
        proxy_set_header X-RentCompass-Rollout-Weight $rentcompass_candidate_weight;
        proxy_set_header X-RentCompass-Assigned-Pool  $rentcompass_pool;
        proxy_set_header X-RentCompass-Traffic-Source edge;

        # --- Server-Sent Events: the agent streams tokens/steps live. ---
        # Without these, nginx buffers the response and the UI appears frozen
        # until the whole turn finishes.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # An agent turn calls the LLM and can run tens of seconds; keep the
        # upstream connection open long enough to finish streaming.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
