# rentcompass.co.uk — HTTPS on the default port 443.
# Installed by deploy/setup_tls.sh AFTER the certificate is issued.
#
# Xray used to hold 443 and the site was served on 8443; deploy/migrate_ports_443.sh
# swapped them, so Xray is on 8443 now. Anything binding 443 here must therefore stay
# in sync with the x-ui inbound — see that script's header.
#
# Path: /etc/nginx/sites-available/rentcompass.co.uk.conf  (replaces the HTTP-only one)
# Access: https://rentcompass.co.uk

upstream rentcompass_app {
    server 127.0.0.1:5001;
    keepalive 32;
}

# --- HTTP :80 — answer ACME challenges, redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name rentcompass.co.uk www.rentcompass.co.uk;

    # Keep cert renewals working even with the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — the real site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rentcompass.co.uk www.rentcompass.co.uk;

    ssl_certificate     /etc/letsencrypt/live/rentcompass.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentcompass.co.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 256k;

    location / {
        proxy_pass http://rentcompass_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # This nginx instance is the sole trusted edge. Overwrite, never append,
        # so a client-supplied X-Forwarded-For value cannot become Uvicorn's
        # apparent client address and rotate an application rate-limit bucket.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # SSE streaming — never buffer the agent's live token stream.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
